[package]
name = "ooze"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Your Vercel projects, live, in a terminal: who's on them, what's deploying, what's failing and what it all costs"
license = "MIT"
repository = "https://github.com/pdcgomes/ooze"
readme = "README.md"
keywords = ["vercel", "tui", "analytics", "deployments", "dashboard"]
categories = ["command-line-utilities", "visualization"]
exclude = ["docs/", "scripts/"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
png = "0.18"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
